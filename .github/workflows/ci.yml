name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install pinned TinyGo
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tinygo0.41.1.linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            --output "$archive" \
            https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo0.41.1.linux-amd64.tar.gz
          echo 'e156d1d93a376eef639a4143d13be07e8c463fb6cf2d7d447698ed4474d23e91  '"$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"

      - name: Install pinned GoSX
        shell: bash
        run: |
          set -euo pipefail
          # gosx size pins its measurement to a CLI built with Go 1.26.0 and
          # brotli v1.2.1 (internal/assetmeasure), not the go.mod toolchain.
          GOTOOLCHAIN=go1.26.0 go install m31labs.dev/gosx/cmd/gosx@v0.57.18
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          go version
          [[ "$(gosx version)" == 'gosx v0.57.18' ]]
          tinygo version | grep -Fq 'tinygo version 0.41.1'

      - name: Verify module graph and Go code
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test ./... -count=1
          go vet ./...

      - name: Run production release gate
        shell: bash
        env:
          PLAYGROUND_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # Hosted Ubuntu restricts user namespaces for downloaded Chrome.
          GOSX_CHROME_NO_SANDBOX: "1"
          RUN_BROWSER_PERF: "1"
        run: ./scripts/verify-production.sh

      - name: Keep the production build for Lighthouse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 3
          if-no-files-found: error

      - name: Confirm tracked sources remain clean
        shell: bash
        run: git diff --exit-code

  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Start the production server
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/run.sh dist/server/app   # upload-artifact drops the executable bit
          PORT=18090 GOSX_ENV=production ./dist/run.sh >lighthouse-server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:18090/healthz >/dev/null && break
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:18090/healthz | grep -q '"ok":true'

      - name: Lighthouse (mobile, median of 3 cold runs)
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.sha }}
          path: |
            lighthouse-results
            lighthouse-server.log
          retention-days: 14
